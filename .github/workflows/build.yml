# Windows, macOS ve Linux paketlerini derler. "v" ile başlayan bir etiket gönderilince taslak sürüm (draft release)
# oluşturur; sürümü GitHub'da gözden geçirip "Publish" ile yayınlarsınız.
name: Build

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin: dist/WaveSnap/WaveSnap.exe
          - os: macos-latest
            bin: dist/WaveSnap.app/Contents/MacOS/WaveSnap
          - os: ubuntu-22.04
            bin: dist/WaveSnap/wavesnap
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt pyinstaller

      - name: Driver tests (simulated routers)
        run: python araclar/surucu_testi.py

      - name: Smoke test (source)
        run: python araclar/duman_testi.py

      - name: Build
        run: pyinstaller paket/wavesnap.spec --noconfirm

      - name: Smoke test (packaged app)
        shell: bash
        run: |
          export WAVESNAP_VERI="$RUNNER_TEMP/wavesnap-veri"
          "${{ matrix.bin }}" --background &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8765/api/durum -o durum.json && break
            sleep 1
          done
          python -c "import json; v = json.load(open('durum.json')); print('ok, kurulu =', v['kurulu'])"
          "${{ matrix.bin }}" --quit
          sleep 2
          ! curl -sf http://127.0.0.1:8765/api/durum > /dev/null

      - name: Version
        id: surum
        shell: bash
        run: echo "surum=$(python -c 'import sistem; print(sistem.SURUM)')" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DSurum=${{ steps.surum.outputs.surum }}" paket\wavesnap.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\WaveSnap -DestinationPath "dist\WaveSnap-${{ steps.surum.outputs.surum }}-windows-portable.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname WaveSnap -srcfolder dist/WaveSnap.app -ov -format UDZO \
            "dist/WaveSnap-${{ steps.surum.outputs.surum }}-macos-$(uname -m).dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf "dist/WaveSnap-${{ steps.surum.outputs.surum }}-linux-x86_64.tar.gz" WaveSnap

      - uses: actions/upload-artifact@v4
        with:
          name: wavesnap-${{ matrix.os }}
          path: |
            dist/WaveSnap-*.exe
            dist/WaveSnap-*.zip
            dist/WaveSnap-*.dmg
            dist/WaveSnap-*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "WaveSnap $GITHUB_REF_NAME" --generate-notes --draft
